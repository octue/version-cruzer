[project]
name = "pycruzer"
version = "0.1.4"
description = ""
authors = [
    {name = "Juan Cruz Viotti", email = "jv@jviotti.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.args = [
  "-DCMAKE_BUILD_TYPE:STRING=Release",
  "-DCRUZER_PYTHON=ON",
  "-DCRUZER_TESTS=OFF",
  "-DBUILD_SHARED_LIBS:BOOL=OFF"
]
