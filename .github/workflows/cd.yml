name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 4.0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk/emsdk activate ${{ env.EMSDK_VERSION }}
          rm -rf emsdk/upstream/emscripten/cmake
          echo "$(pwd)/emsdk/upstream/emscripten" >> $GITHUB_PATH
      - run: make -C bindings/webassembly compile
      - run: cd bindings/webassembly && npm version ${{ github.ref_name }} && npm publish
        if: github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4
      - run: make -C bindings/python compile
      - uses: actions/upload-artifact@v4
        with:
          name: python-bindings-${{ matrix.runner }}
          path: bindings/python/dist/*

  github:
    needs: python
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: tree dist
      - run: gh config set prompt disabled
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          gh release create ${{ github.ref_name }} --draft=false --title ${{ github.ref_name }} --target "$GITHUB_SHA" --generate-notes
          gh release upload --clobber ${{ github.ref_name }} dist/lib/*
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
